{% from "templates/includes/rfq/rfq_macros.html" import item_name_and_description %}

{% for d in doc.items %}
<div class="rfq-item">
	<div class="row" style="display: flex; align-items: flex-start;">

		<!-- Item Name & Description (4) -->
		<div class="col-sm-4 col-12" style="margin-bottom: 10px;margin-top: 5px; font-size: 16px;">
			{{ item_name_and_description(d, doc) }}
		</div>

		<div class="col-sm-1 col-4 text-right" style="flex: 0 0 10%; max-width: 10%;">
			<input type="text"
				class="form-control text-right rfq-qty"
				value="{{ d.get_formatted('qty') }}"
				data-idx="{{ d.idx }}"
				style="margin-top: 5px; padding: 5px;">
			<p class="text-muted small" style="margin-top: 10px; font-size: 16px;">
				{{ d.uom }}
			</p>
		</div>

		<div class="col-sm-2 col-4 text-right">
			<input type="text"
				class="form-control text-right rfq-rate"
				value="0.00"
				data-idx="{{ d.idx }}"
				style="margin-top: 5px; font-size: 16px;">
		</div>

		<div class="col-sm-1 col-4 text-right">
			<input type="text"
				class="form-control text-right rfq-discount"
				placeholder="Disc%"
				data-idx="{{ d.idx }}"
				style="margin-top: 5px; padding: 5px; font">
		</div>

		<div class="col-sm-2 col-3 text-right">
			<select class="form-control rfq-gst"
				data-idx="{{ d.idx }}"
				style="margin-top: 5px; font-size: 16px; padding: 1px;">
				<option value="">Select GST</option>
			</select>
		</div>

		<div class="col-sm-3col-3 text-left" style="padding-top: 12px; font-weight: bold;margin-left: 50px; font-size: 16px;">
			{{ doc.currency_symbol }}
			<span class="rfq-amount" data-idx="{{ d.idx }}">0.00</span>
		</div>

	</div>
</div>
{% endfor %}


<script>
frappe.ready(function () {

	// LOAD ONLY GST ITEM TAX TEMPLATES
	frappe.call({
		method: "frappe.client.get_list",
		args: {
			doctype: "Item Tax Template",
			fields: ["name"],
			filters: [
				["company", "like", doc.company],
				["disabled", "=", 0],
				["name", "like", "%GST%"]
			],
			limit_page_length: 100
		},
		callback: function (r) {
			if (r.message) {
				$(".rfq-gst").each(function () {
					let select = $(this);
					select.empty();
					select.append(`<option value="">Select GST</option>`);

					r.message.forEach(row => {
						select.append(
							`<option value="${row.name}">${row.name}</option>`
						);
					});
				});
			}
		}
	});



	// LIVE AMOUNT CALCULATION
	$(document).on("input", ".rfq-qty, .rfq-rate, .rfq-discount", function () {
		let idx = $(this).data("idx");
		let qty = parseFloat($(".rfq-qty[data-idx='"+idx+"']").val()) || 0;
		let rate = parseFloat($(".rfq-rate[data-idx='"+idx+"']").val()) || 0;
		let discount = parseFloat($(".rfq-discount[data-idx='"+idx+"']").val()) || 0;

		let amount = qty * rate;
		let discount_amount = (amount * discount) / 100;
		let net_amount = amount - discount_amount;

		$(".rfq-amount[data-idx='"+idx+"']").text(net_amount.toFixed(2));
	});

	window.get_rfq_items_data = function () {
		let items = [];
		$(".rfq-item").each(function () {
			let idx = $(this).find(".rfq-qty").data("idx");
			items.push({
				qty: $(".rfq-qty[data-idx='"+idx+"']").val(),
				rate: $(".rfq-rate[data-idx='"+idx+"']").val(),
				discount: $(".rfq-discount[data-idx='"+idx+"']").val(),
				item_tax_template: $(".rfq-gst[data-idx='"+idx+"']").val()  
			});
		});
		return items;
	};
});

</script>
